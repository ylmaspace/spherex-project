name: SPHEREx Explorer tests

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest
      - name: Run automated tests
        run: python -m pytest -q
      - name: Set up Node.js for frontend syntax checks
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate frontend JavaScript syntax
        run: |
          node --check frontend/script.js
          node --check frontend/multifits.js
