services:
  - type: web
    name: ylma-spherex-explorer-eu
    runtime: python
    region: frankfurt
    plan: free
    branch: copilot/audit-repair-spherex-explorer
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      # Set manually in Render to the connection URL of the existing spherex-project-database.
      # No database resource is declared here, so this Blueprint will not create one.
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://spherexexplorer.study,https://www.spherexexplorer.study
      - key: DEMO_MODE
        value: "false"
      - key: IRSA_TIMEOUT_SECONDS
        value: "20"
      - key: IRSA_MAX_RESULTS
        value: "100"
      - key: LOG_LEVEL
        value: INFO
