services:
  - type: web
    name: ylma-spherex-explorer
    runtime: python
    plan: free
    branch: deploy/render-production
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://spherexexplorer.study,https://www.spherexexplorer.study,http://localhost:5500,http://127.0.0.1:5500
